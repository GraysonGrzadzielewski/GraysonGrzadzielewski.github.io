<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{{title}}</title>
        <link rel="stylesheet" type="text/css" href="css/global.css">
        <script src="js/index.js" defer></script>
    </head>

    <body class="frame">
        <div id="banner" class="frame"><img src="img/banner_render_quantized.png"></div>
        <div class="block-frame">
            <aside class="frame inline-frame">
                <div class="navbuttons">
                    <button id="homeButton" class="defaultButton toggleButton">HOME</button>
                    <button id="blogButton" class="defaultButton toggleButton">BLOG</button>
                    <button id="resumeButton" class="defaultButton toggleButton">RESUME</button>
                    <button id="contactButton" class="defaultButton toggleButton">CONTACT</button>
                </div>
                <div class="motd frame">
                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua</p>
                </div>
                <div class="blinkies">
                    <img class="gif" src="img/css lover.gif"/>
                    <img class="gif" src="img/trans rights.gif">
                    <img class="gif" src="img/i need sleep.gif">
                    <img class="gif" src="img/dvds crazy.gif">
                </div>
                <div class="stamps">
                    <img class="gif" src="img/rip winxp.gif"/>
                    <img class="gif" src="img/my stamp is on fire.gif"/>
                    <img class="gif" src="img/Abducted by Aliens.png"/>
                    <img class="gif" src="img/qwerty moss.png"/>
                </div>
            </aside>
            <article class="inline-frame">
                <div id="homeContent" class="articleContent contentDisplayed">
                    {{home_content}}
                </div>
                <div id="blogContent" class="articleContent ">
                    <p>Dev Blog Text</p>
                </div>
                <div id="resumeContent" class="articleContent ">
                    <p>Dev Resume Text</p>
                </div>
                <div id="contactContent" class="articleContent ">
                    <p>Dev Contact Text</p>
                </div>
            </article>
        </div>
    </body>
</html>
